# Nginx 로드 밸런서 & 리버스 프록시 설정

# 로드 밸런서를 위한 업스트림 서버 그룹 정의
# 여기서 업스트림 서버란, Spring Boot 애플리케이션 인스턴스들을 의미한다.
upstream spring_backend {

  # Spring Boot 인스턴스들
  server discodeit-instance-1:8080 max_fails=3 fail_timeout=30s;
  server discodeit-instance-2:8080 max_fails=3 fail_timeout=30s;
  server discodeit-instance-3:8080 max_fails=3 fail_timeout=30s;

  # Keep-alive 연결 설정
  keepalive 64;
}

server {
  # 3000번 포트로 외부에서 접근 가능하도록 설정
	listen 3000;
    # localhost 도메인으로 접근 가능하도록 설정
    server_name localhost;

    # 에러 로그 레벨 설정 (SSL 디버깅용)
    error_log /dev/stderr info;

    # 성능 최적화 설정
    # 커널 공간에서 직접 파일을 전송하여 메모리 복사 과정을 생략함으로써 I/O 성능을 향상시킨다
	  sendfile on;
	  # 작은 패킷들을 모아서 한 번에 전송하여 네트워크 효율성을 높인다 (sendfile과 함께 사용 시 효과적)
    tcp_nopush on;
	  # TCP 소켓에서 Nagle 알고리즘을 비활성화하여 작은 패킷도 즉시 전송하여 응답 지연을 최소화한다
    tcp_nodelay on;
	  # 클라이언트와의 연결을 65초 동안 유지하여 연결 재사용을 통한 오버헤드를 줄인다
    keepalive_timeout 65;
	  # MIME 타입을 저장하는 해시 테이블의 최대 크기를 설정하여 파일 타입 처리 성능을 최적화한다
    types_hash_max_size 2048;

    client_max_body_size 10M;

    # 기본 프록시 설정
    # HTTP/1.1 프로토콜 사용
    proxy_http_version 1.1;
    # WebSocket 업그레이드 헤더 설정
    proxy_set_header Upgrade $http_upgrade;
    # 연결 유지
    proxy_set_header Connection "";
    # 호스트 헤더 설정
    proxy_set_header Host $host;
    # 실제 클라이언트 IP 헤더 설정
    proxy_set_header X-Real-IP $remote_addr;
    # 프록시 추가 IP 헤더 설정
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 프로토콜 헤더 설정
    proxy_set_header X-Forwarded-Proto $scheme;

    # 타임아웃 설정
    # 연결 타임아웃
    proxy_connect_timeout 30s;
    # 전송 타임아웃
    proxy_send_timeout 30s;
    # 읽기 타임아웃
    proxy_read_timeout 30s;

    # 모든 API 요청 (/api/*)을 Backend 컨테이너로 프록시
    location /api/ {
        proxy_pass http://spring_backend;

        # 캐시 비활성화
        proxy_cache off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # 실시간 처리 헤더
        add_header X-Cache-Status "BYPASS" always;

        # 어떤 백엔드 서버가 응답했는지 헤더로 표시
        add_header X-Upstream-Server $upstream_addr always;

        # 에러 처리 및 장애 조치
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    # WebSocket 요청 (/ws/*)을 Backend 컨테이너로 프록시
    location /ws/ {
        proxy_pass http://spring_backend;

        # WebSocket 업그레이드 헤더 설정
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;  # 5분

        # 어떤 백엔드 서버가 응답했는지 헤더로 표시
        add_header X-Upstream-Server $upstream_addr always;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
}

#######################################################################
# Nginx Reverse Proxy 설정 (HTTP 전용)
# - 외부 진입점: 호스트 3000 → 컨테이너 80
# - /api/*, /ws/* → 백엔드(app:8080)
# - 그 외 → 정적 리소스(/usr/share/nginx/html)
#######################################################################

# 로깅 포맷(선택)
log_format proxy_detailed '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'upstream_response_time=$upstream_response_time '
                          'request_time=$request_time';
access_log /dev/stdout proxy_detailed;
error_log /dev/stderr info;

# Docker 내장 DNS (컨테이너 내부) - upstream resolve 사용을 위해 http 컨텍스트에서 지정
resolver 127.0.0.11 ipv6=off valid=30s;

# Compose 서비스명(app)을 사용하는 백엔드 업스트림
upstream app_backend {
    zone app_backend 64k;
    least_conn;                 # Least Connections
    server app:8080 resolve;
    keepalive 64;
}

# WebSocket/SockJS 전용 업스트림: 클라이언트 IP 기반 스티키
upstream app_ws {
    zone app_ws 64k;
    ip_hash;                    # IP Hash로 세션 고정
    server app:8080 resolve;
    keepalive 64;
}

# WebSocket 업그레이드 헤더 매핑
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 컨테이너 내부 리스닝 포트(Compose에서 3000:80으로 매핑)
    listen 80;
    server_name _;

    # 정적 리소스 루트(프론트엔드 빌드 결과 복사 경로)
    root /usr/share/nginx/html;
    index index.html;

    # 업로드 사이즈(필요 시 조정)
    client_max_body_size 50m;

    # 공통 프록시 헤더(원본 스킴/호스트 전달)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # SSE/WS 친화 옵션
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;

    # (중복 제거) /api/* 프록시는 아래 일반 API 블록에서 처리합니다.

    ###############################################################
    # /ws/* → 백엔드(WebSocket)
    ###############################################################
    # 1) 네이티브 WebSocket: 정확히 /ws
    location = /ws {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      add_header X-Upstream-Server $upstream_addr;
      proxy_pass http://app_ws;
    }

    # 2) 네이티브 WebSocket: SockJS가 사용하는 .../websocket 엔드포인트
    location ~ ^/ws/.+/websocket$ {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      add_header X-Upstream-Server $upstream_addr;
      proxy_pass http://app_ws;
    }

    # 3) 그 외 폴백 트랜스포트들(xhr, eventsource, htmlfile, jsonp, info 등)은 업그레이드 헤더 금지
    #    (info는 캐시 금지도 권장)
    location = /ws/info {
      add_header Cache-Control no-cache;
      add_header X-Upstream-Server $upstream_addr;
      proxy_pass http://app_ws;
    }

    location /ws/ {
      add_header X-Upstream-Server $upstream_addr;
      proxy_pass http://app_ws;
    }

    ###############################################################
    # SSE
    ###############################################################
    location ^~ /api/sse {
        add_header X-Upstream-Server $upstream_addr;
        proxy_pass http://app_backend;
    }

    ###############################################################
    # 일반 API
    ###############################################################
    location ^~ /api/ {
        add_header X-Upstream-Server $upstream_addr;
        proxy_pass http://app_backend;
    }

    ###############################################################
    # 그 외 → 정적 리소스 (SPA 라우팅 고려)
    ###############################################################
    location / {
        try_files $uri $uri/ /index.html;
    }
}

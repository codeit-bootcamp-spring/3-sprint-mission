#######################################################################
# Nginx Reverse Proxy 설정 (HTTP 전용)
# - 외부 진입점: 호스트 3000 → 컨테이너 80
# - /api/*, /ws/* → 백엔드(app:8080)
# - 그 외 → 정적 리소스(/usr/share/nginx/html)
#######################################################################

# 로깅 포맷(선택)
log_format proxy_detailed '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'upstream_response_time=$upstream_response_time '
                          'request_time=$request_time';
access_log /dev/stdout proxy_detailed;
error_log /dev/stderr info;

# [ADDED] Docker 내장 DNS(resolver)를 http 레벨에 선언
resolver 127.0.0.11 ipv6=off valid=30s;

# [REMOVED] Authorization 기반 스티키 해시 (원복)

# Compose 서비스명(app)을 사용하는 백엔드 업스트림
upstream app_backend {
    zone app_backend 64k;      # [ADDED] resolve 사용 시 공유 메모리 존 필요
    least_conn;                # [RESTORED] 기본: 최소 연결

    server app:8080 resolve max_fails=1 fail_timeout=5s; # 비정상 인스턴스 빠른 배제
    # server app:8080 resolve weight=2;  # [OPTION] Weight 예시
    keepalive 64;
}

# WebSocket 업그레이드 헤더 매핑
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 컨테이너 내부 리스닝 포트(Compose에서 3000:80으로 매핑)
    listen 80;
    server_name _;

    # Docker 내장 DNS는 http 레벨에 선언됨 [MOVED]

    # 정적 리소스 루트(프론트엔드 빌드 결과 복사 경로)
    root /usr/share/nginx/html;
    index index.html;

    # 업로드 사이즈(필요 시 조정)
    client_max_body_size 50m;

    # 공통 프록시 헤더(원본 스킴/호스트 전달)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # SSE/WS 친화 옵션
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;          # [ADDED] 연결 지연 시 빠르게 다른 업스트림으로
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;

    # [ADDED] 장애 전이 설정: 에러/타임아웃/5xx시 다음 업스트림으로 재시도
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_next_upstream_tries 3;

    ###############################################################
    # /api/* → 백엔드 프록시
    ###############################################################
    # [REMOVED] 중복된 /api/ 프록시 블록 제거(아래 ^~ /api/ 블록으로 통합)

    ###############################################################
    # /ws/* → 백엔드(WebSocket)
    ###############################################################
    # 1) 네이티브 WebSocket: 정확히 /ws
    location = /ws {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      add_header X-Upstream-Server $upstream_addr;   # [ADDED]
      proxy_pass http://app_backend;
    }

    # 2) 네이티브 WebSocket: SockJS가 사용하는 .../websocket 엔드포인트
    location ~ ^/ws/.+/websocket$ {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      add_header X-Upstream-Server $upstream_addr;   # [ADDED]
      proxy_pass http://app_backend;
    }

    # 3) 그 외 폴백 트랜스포트들(xhr, eventsource, htmlfile, jsonp, info 등)은 업그레이드 헤더 금지
    #    (info는 캐시 금지도 권장)
    location = /ws/info {
      add_header Cache-Control no-cache;
      add_header X-Upstream-Server $upstream_addr;   # [ADDED]
      proxy_pass http://app_backend;
    }

    location /ws/ {
      add_header X-Upstream-Server $upstream_addr;   # [ADDED]
      proxy_pass http://app_backend;
    }

    ###############################################################
    # SSE
    ###############################################################
    location ^~ /api/sse {
        add_header X-Upstream-Server $upstream_addr; # [FIXED]
        proxy_pass http://app_backend;
    }

    ###############################################################
    # 일반 API
    ###############################################################
    location ^~ /api/ {
        add_header X-Upstream-Server $upstream_addr; # [ADDED]
        proxy_pass http://app_backend;               # [UNCHANGED]
    }

    ###############################################################
    # 그 외 → 정적 리소스 (SPA 라우팅 고려)
    ###############################################################
    location / {
        try_files $uri $uri/ /index.html;
    }
}

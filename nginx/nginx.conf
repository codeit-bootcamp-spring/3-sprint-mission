worker_processes auto;

events { worker_connections 1024; }

http {
  # Docker 내 DNS
  resolver 127.0.0.11 valid=10s ipv6=off;

  # 로그/기본 헤더
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # === 업스트림들: 하나 골라서 사용 ===

  # 1) Round Robin (기본값)
  upstream backend_rr {
    zone backend_rr 64k;
    server backend:8080 resolve;
    keepalive 64;
  }

  # 2) Least Connections
  upstream backend_least {
    least_conn;
    zone backend_least 64k;
    server backend:8080 resolve;
    keepalive 64;
  }

  # 3) IP Hash (클라이언트 IP 고정 → SSE/WS에 유용)
  upstream backend_iphash {
    ip_hash;
    zone backend_iphash 64k;
    server backend:8080 resolve;
    keepalive 64;
  }

  # 4) Weight (가중치)  ※ 단일 호스트네임에 weight를 주면
  #   해석된 각 IP에 동일 가중치가 적용되는 것으로 보긴 어렵다.
  #   실제 가중치를 시험하려면 별도 서비스명(backend-a/b 등)을 두는 편이 명확.
  upstream backend_weighted {
    zone backend_weighted 64k;
    server backend:8080 resolve weight=3;
    keepalive 64;
  }

  # WebSocket 업그레이드
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 3000;

    # 정적
    root /usr/share/nginx/html;
    location / {
      try_files $uri /index.html;
    }

    # ====== 여기서 하나 골라서 프록시 대상 변경 ======
    # set $backend upstream 이름
    set $backend backend_rr;      # round-robin
    # set $backend backend_least; # least-connections
    # set $backend backend_iphash;# ip-hash
    # set $backend backend_weighted; # weighted
    # ================================================

    # SSE
    location ^~ /api/sse {
      proxy_http_version 1.1;
      proxy_read_timeout 1h;
      proxy_buffering off;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_pass http://$backend;

      add_header X-Upstream-Server $upstream_addr always;
      add_header Cache-Control 'no-cache' always;
    }

    # API
    location ^~ /api/ {
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_pass http://$backend;

      add_header X-Upstream-Server $upstream_addr always;
    }

    # WebSocket (/ws/*)
    location ^~ /ws/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;

      proxy_pass http://$backend;

      add_header X-Upstream-Server $upstream_addr always;
    }
  }
}

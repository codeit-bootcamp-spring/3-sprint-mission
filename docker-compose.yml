services:
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - public
      - private
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-dist:/usr/share/nginx/html:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: discodeit/backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: compose

      # DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/discodeit
      SPRING_DATASOURCE_USERNAME: discodeit_user
      SPRING_DATASOURCE_PASSWORD: discodeit1234

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Storage
      STORAGE_TYPE: local
      STORAGE_LOCAL_ROOT_PATH: /data/storage

    depends_on:
      - db
      - redis
      - kafka
    networks:
      - private
    volumes:
      - app-storage:/data/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discodeit
      POSTGRES_USER: discodeit_user
      POSTGRES_PASSWORD: discodeit1234
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - private

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - private

  kafka:
    image: bitnami/kafka:3.7
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - private

volumes:
  db-data:
  kafka-data:
  app-storage:

networks:
  public: {}
  private:
    internal: true

spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량
    session:
      timeout: 1m
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  profiles:
    active:
      - dev
  config:
    import: optional:file:.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  observations:
    annotations:
      enabled: true

info:
  name: Discodeit
  version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.4.0
  config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.maxFileSize}
      max-request-size: ${spring.servlet.multipart.maxRequestSize}

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}  # local | s3 (기본값: local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)
    admin:
      username: ${DISCODEIT_ADMIN_USERNAME}
      email: ${DISCODEIT_ADMIN_EMAIL}
      password: ${DISCODEIT_ADMIN_PASSWORD}
    jwt:
      access-token:
        secret: ${JWT_ACCESS_SECRET:the-older-i-get-the-more-that-i-see-my-parents-arent-heros-theyre-just-like-me}
        expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000} # 30 minutes
      refresh-token:
        secret: ${JWT_REFRSH_SECRET:and-loving-is-hard-it-dont-always-work-you-just-try-your-best-not-to-get-hurt}
        expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

logging:
  level:
    root: info
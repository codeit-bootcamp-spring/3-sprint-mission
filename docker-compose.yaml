version: '3.8'

# ====================================================================
# 서비스 정의
# ====================================================================

services:
  # Nginx 로드 밸런서
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: discodeit-nginx
    ports:
      - "3000:3000"
    networks:
      - discodeit-network
    depends_on:
      - discodeit-instance-1
      - discodeit-instance-2
      - discodeit-instance-3
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

    volumes:
      - ./src/main/resources/static:/usr/share/nginx/html:ro

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot 인스턴스 1
  discodeit-instance-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discodeit-instance-1
    hostname: discodeit-instance-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - discodeit-network

    # 환경변수 설정
    environment:
      # Spring 프로파일
      SPRING_PROFILES_ACTIVE: docker

      # 데이터베이스 연결 정보
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-discodeit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-discodeit_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-discodeit1234}

      # JVM 설정
      JVM_OPTS: ${JVM_OPTS:-}

      # 로깅 설정
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_PATH: /app/.logs/compose-application.log

      STORAGE_TYPE: ${STORAGE_TYPE}

      # 로컬 스토리지 경로(필요 시 fallback)
      STORAGE_LOCAL_ROOT_PATH: ${STORAGE_LOCAL_ROOT_PATH:-./.binarycontents}

      # 기타 설정
      TZ: "Asia/Seoul"
      INSTANCE_NAME: "discodeit-instance-1"

    # 볼륨 마운트
    volumes:
      # 로그 디렉토리 마운트
      - app_logs:/app/.logs
      # 데이터 디렉토리 (선택사항)
      - app_data_1:/app/.binarycontents

    # 헬스체크 설정 (시작 시간 연장)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/discodeit/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 2분으로 연장

  # Spring Boot 인스턴스 2
  discodeit-instance-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discodeit-instance-2
    hostname: discodeit-instance-2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - discodeit-network

    # 환경변수 설정
    environment:
      # Spring 프로파일
      SPRING_PROFILES_ACTIVE: docker

      # 데이터베이스 연결 정보
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-discodeit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-discodeit_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-discodeit1234}

      # JVM 설정
      JVM_OPTS: ${JVM_OPTS:-}

      # 로깅 설정
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_PATH: /app/.logs/compose-application.log

      STORAGE_TYPE: ${STORAGE_TYPE}

      # 로컬 스토리지 경로(필요 시 fallback)
      STORAGE_LOCAL_ROOT_PATH: ${STORAGE_LOCAL_ROOT_PATH:-./.binarycontents}

      # 기타 설정
      TZ: "Asia/Seoul"
      INSTANCE_NAME: "discodeit-instance-2"

    # 볼륨 마운트
    volumes:
      # 로그 디렉토리 마운트
      - app_logs:/app/.logs
      # 데이터 디렉토리 (선택사항)
      - app_data_2:/app/.binarycontents

    # 헬스체크 설정 (시작 시간 연장)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/discodeit/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 2분으로 연장

  # Spring Boot 인스턴스 3
  discodeit-instance-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discodeit-instance-3
    hostname: discodeit-instance-3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - discodeit-network

    # 환경변수 설정
    environment:
      # Spring 프로파일
      SPRING_PROFILES_ACTIVE: docker

      # 데이터베이스 연결 정보
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-discodeit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-discodeit_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-discodeit1234}

      # JVM 설정
      JVM_OPTS: ${JVM_OPTS:-}

      # 로깅 설정
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_PATH: /app/.logs/compose-application.log

      STORAGE_TYPE: ${STORAGE_TYPE}

      # 로컬 스토리지 경로(필요 시 fallback)
      STORAGE_LOCAL_ROOT_PATH: ${STORAGE_LOCAL_ROOT_PATH:-./.binarycontents}

      # 기타 설정
      TZ: "Asia/Seoul"
      INSTANCE_NAME: "discodeit-instance-3"

    # 볼륨 마운트
    volumes:
      # 로그 디렉토리 마운트
      - app_logs:/app/.logs
      # 데이터 디렉토리 (선택사항)
      - app_data_3:/app/.binarycontents

    # 헬스체크 설정 (시작 시간 연장)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/discodeit/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 2분으로 연장

  # PostgreSQL 데이터베이스 서비스
  postgres:
    image: postgres:17-alpine
    container_name: discodeit-db
    restart: unless-stopped

    # 환경변수 설정
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discodeit}
      POSTGRES_USER: ${POSTGRES_USER:-discodeit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discodeit1234}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      TZ: "Asia/Seoul"

    # 볼륨 마운트 (데이터 영속화)
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # 헬스체크 설정
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discodeit_user} -d ${POSTGRES_DB:-discodeit}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    expose:
      - "5432"

    # 네트워크 설정
    networks:
      - discodeit-network

# ====================================================================
# 볼륨 정의 (데이터 영속화)
# ====================================================================
volumes:
  # PostgreSQL 데이터 볼륨
  postgres_data:
    driver: local
    name: discodeit-postgres-data

  # 애플리케이션 로그 볼륨
  app_logs:
    driver: local
    name: discodeit-app-logs

  # 애플리케이션 데이터 볼륨
  app_data_1:
    driver: local
    name: discodeit-app-data-1

  app_data_2:
    driver: local
    name: discodeit-app-data-2

  app_data_3:
    driver: local
    name: discodeit-app-data-3

# ====================================================================
# 네트워크 정의
# ====================================================================
networks:
  discodeit-network:
    driver: bridge
    name: discodeit-network
name: CI - Test new source

on:
  # main 브랜치로 PR이 생성될 때 워크플로우 실행
  pull_request:
    branches: [ main ]

env:
  AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
  AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
  DISCODEIT_ADMIN_USERNAME: ${{ secrets.DISCODEIT_ADMIN_USERNAME}}
  DISCODEIT_ADMIN_EMAIL: ${{ secrets.DISCODEIT_ADMIN_EMAIL }}
  DISCODEIT_ADMIN_PASSWORD: ${{ secrets.DISCODEIT_ADMIN_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # PR 브랜치의 코드를 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 17 환경 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      # gradlew 실행 권한 부여 (리눅스 환경)
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 일반 테스트 및 통합 테스트 실행
      - name: Run unit tests and integration tests with coverage
        run: ./gradlew test integrationTest jacocoMergedReport

      # Codecov에 커버리지 업로드
      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/jacocoMergedReport/jacocoMergedReport.xml
          fail_ci_if_error: true
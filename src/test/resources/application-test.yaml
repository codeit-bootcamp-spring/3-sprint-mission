spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS discodeity
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: discodeit
        hbm2ddl:
          create_namespaces: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  kafka:
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest

discodeit:
  jwt:
    access-token:
      secret: test-access-token-secret-key-for-jwt-token-generation-and-validation-must-be-long-enough-for-testing
      expiration-ms: 1800000 # 30 minutes
    refresh-token:
      secret: test-refresh-token-secret-key-for-jwt-token-generation-and-validation-must-be-different-and-long-for-testing
      expiration-ms: 604800000 # 7 days
  storage:
    type: local
    local:
      root-path: ./build/test-binary-storage

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace
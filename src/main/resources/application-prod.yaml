server:
  port: 80

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false
    #        default_batch_fetch_size: 100

logging:
  level:
    com.sprint.mission.discodeit: info
    org.hibernate.SQL: info
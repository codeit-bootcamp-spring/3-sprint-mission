server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    # Spring Security 관련 디버그 로그 활성화
    org.springframework.security: DEBUG
    # Spring Web 관련 디버그 로그 활성화
    org.springframework.web: DEBUG
    # 애플리케이션 패키지 디버그 로그 활성화
    com.ohgiraffers.sessionauth: DEBUG

management:
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
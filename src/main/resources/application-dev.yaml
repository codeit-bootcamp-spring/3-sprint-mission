# 개발 환경 설정
server:
  port: 8080
  servlet:
    session:
      # 원래 Spring Security의 서버 세션 유지 기간은 디폴트로 30분이다.
      timeout: 30m

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    hikari:
      connection-init-sql: SET SESSION hibernate.jdbc.lob.non_contextual_creation=true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.sprint.mission.discodeit: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.hibernate.orm.jdbc.bind: TRACE
    # Spring Security 관련 디버그 로그 활성화
    org.springframework.security: TRACE


info:
  # 데이터소스 정보
  datasource:
    driver-class-name: ${spring.datasource.driver-class-name}

  # 스토리지 설정 정보
  storage:
    type: ${discodeit.storage.type}

    # 멀티파트 설정 정보
  multipart:
    max-file-size: ${spring.servlet.multipart.max-file-size}
    max-request-size: ${spring.servlet.multipart.max-request-size}

discodeit:
  # JWT 설정
  jwt:
    access-token:
      secret: ${JWT_ACCESS_SECRET:Hd08eNsaSd67aFrfBqmW6C3uXse8a2RYvtiEB2FQ-2A}
      expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000} # 30 minutes
    refresh-token:
      secret: ${JWT_REFRESH_SECRET:ezJI5LxI-t6Wwa9gwFnrn_ZmsEjifDvowl09NFf0hzs}
      expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace   # 각 요청마다 필터 체인 상세 로그
    org.springframework.web: debug       # (선택) 웹 디버그

management:
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true